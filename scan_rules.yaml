# 非公开数据扫描规则（AC-10 / D-010）
#
# D-010 原话：「这不能只靠自觉。Phase 1 起加入自动扫描（AC-10），**扫描规则本身也进版本控制**。」
# 这个文件就是那句话的落点：**规则在这里，代码只执行不判断**，因此规则可以被 diff、被审查、
# 被质疑，而不是藏在某个函数的 if 里。
#
# fail-closed：本文件缺失、解析失败或缺少任一规则组，扫描一律判为失败并非零退出。
# 「规则读不到就当通过」等于关掉门禁。

rules_version: 2

# --------------------------------------------------------------------------
# 第一组：被 git 跟踪的文件扩展名黑名单
#
# 只看 `git ls-files` 的输出，不扫工作区未跟踪文件——工作区里放什么是本机的事，
# 进了版本控制才是不可挽回的。Phase 1 不需要任何数据文件进仓库；
# 真需要时那必须是一次显式决策，而不是顺手 `git add -A`。
# --------------------------------------------------------------------------
forbidden_tracked_file_types:
  - .xlsx
  - .xls
  - .csv
  - .db
  - .sqlite
  - .parquet
  - .pdf
  - .docx

# --------------------------------------------------------------------------
# 第二组：.gitignore 里必须存在的隔离条目
#
# 防的是「为了跑通某个脚本临时删掉隔离规则，然后忘了加回来」。
# 这类改动单看 diff 很无害，正因如此需要机器盯着。
# --------------------------------------------------------------------------
gitignore_required_entries:
  - data/raw/
  - data/private/
  - data/cache/
  - .env

# --------------------------------------------------------------------------
# 第三组：内容模式
#
# 扫描范围限于被 git 跟踪的文本文件。
# --------------------------------------------------------------------------

# 不参与 content_patterns 匹配的文件。
#
# 这是门禁上的一个洞，所以它**在版本控制里、需要逐条给理由**——
# 往这里加一行是一次可 diff、可质疑的显式动作，正是 D-010「规则本身也进版本控制」的用意。
# 只豁免 content_patterns：这些文件仍受扩展名黑名单与字段来源检查约束。
#
# 判据：只有「因为要测试/定义模式串本身，所以必然携带模式串」的文件可以进。
# 「这个文件里的邮箱是无害的」**不是**理由——那种情况应该改掉那个邮箱。
content_scan_excluded_paths:
  - scan_rules.yaml        # 模式串的定义处，不排除就永远命中自己
  - tests/test_scan.py     # 扫描器的测试，必须构造各类违规样本才测得动

content_patterns:
  # rules_version 2（2026-08-16）：收紧域名部分，修一个真实误报。
  #
  # 原式 `@[A-Za-z0-9-]+\.[A-Za-z0-9.-]*[A-Za-z]{2,}` 里，域名尾部允许连字符，
  # 于是 npm 的 `包名@版本` 会被当成邮箱：`dsh-root@0.1.0-rc` 命中
  # （域名 `0`、中段 `1.0-`、TLD `rc`）。deepseek-harness 深读报告里出现了这个串，
  # 门禁当场红了。
  #
  # 新式要求 TLD **紧接在一个字面点号之后**且纯字母，版本号形态因此不再命中：
  # `0.1.0-rc` 最后一个点后面是 `0-rc`，以数字开头，不满足 `[A-Za-z]{2,}`。
  #
  # 刻意**不**要求「每个域名标签都含字母」——那样会漏掉 `xxx@163.com` /
  # `xxx@126.com` 这类国内最常见的邮箱，为了修一个误报制造一个漏报，是赔本买卖。
  - rule: CONTACT_PATTERN
    pattern: '[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,}\b'
    description: 邮箱地址形态。个人或企业联系方式不属于公开财报数据，不应出现在本仓库。

  - rule: NETWORK_PATTERN
    pattern: '\b(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'
    description: >-
      RFC1918 私网地址形态。出现即说明内容来自某个内部网络环境。
      只匹配私网段——公网 IP（如 8.8.8.8）不算违规，误报会让人养成绕过门禁的习惯（T-01-16）。

# 机构名 token。**留空是有意的。**
#
# 这里不预填猜测值：猜出来的 token 只会制造噪音，而噪音会让门禁被绕过，
# 那比漏报更糟。这个列表是**发现真实失效模式之后**才往里加的位置。
# 每加一条都应在 commit message 里说明是哪次真实事件触发的。
organization_tokens: []

# --------------------------------------------------------------------------
# 第四组：语义层字段来源（本项目特有，也是这份规则里最有价值的一组）
#
# CLAUDE.md §高代价陷阱 第 1 条要求：「写代码前先问：这个字段名是从哪来的？」
# 这一组把那句人工自查变成机器提问——**来自公开披露报表的哪一张？答不上来就失败。**
#
# 字段名是最隐蔽的泄漏载体：一个内部系统的列名混进来，从内容上看不出任何异常。
# 因此受控的不是内容而是**来源**。
# --------------------------------------------------------------------------
semantic_layer_provenance:
  # 由准则规定、可在任何一份公开年报里找到的报表与章节。
  # 匹配用**前缀**：定义可以细化到具体章节（如 `财务报表附注「非经常性损益项目及金额」`），
  # 受控的是它出自哪张公开报表，不是不许写得更精确。
  allowed_statements:
    - 合并资产负债表
    - 合并利润表
    - 合并现金流量表
    - 合并所有者权益变动表
    - 财务报表附注
    - 主要会计数据和财务指标

  # 字段 id 的根命名空间。与 src/semantic_layer/dsl.py 的 ROOT_NAMESPACES 对应，
  # 另加 kpi（对应「主要会计数据和财务指标」章节的既披露指标）。
  allowed_field_prefixes:
    - bs
    - is
    - cfs
    - notes
    - kpi
