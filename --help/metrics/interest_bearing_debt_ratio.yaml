# 本阶段 `derivation.allow_from_components: true` 的**唯一真实实例**。
#
# 有息负债在合并资产负债表上**没有单一列报行项**，只能由分项加总——
# 所以这里的「倒推」不是缺失时的权宜之计，而是本指标唯一的构造方式。
# 正因如此，允许加总的范围必须被**穷举**，不能含糊授权：
# 一个「允许由分项推算」而不说清哪些分项的定义，等于没有定义。
#
# 与 tracer 和资产负债率的 `false` 分支互补，spec Requirement 3 的两个分支各有真实实例。

metric_id: interest_bearing_debt_ratio
display_name: 有息负债率
aliases:
  - 有息负债占比
  - 有息杠杆率
  - 带息负债率
version: 2

grain:
  entity: stock_code
  period: fiscal_year
  period_type: annual

source_fields:
  - id: bs.short_term_borrowings
    statement: 合并资产负债表
    line_item: 短期借款 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  - id: bs.trading_financial_liabilities
    statement: 合并资产负债表
    line_item: 交易性金融负债 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  - id: bs.non_current_liabilities_due_within_one_year
    statement: 合并资产负债表
    line_item: 一年内到期的非流动负债 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  - id: bs.long_term_borrowings
    statement: 合并资产负债表
    line_item: 长期借款 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  - id: bs.bonds_payable
    statement: 合并资产负债表
    line_item: 应付债券 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  - id: bs.lease_liabilities
    statement: 合并资产负债表
    line_item: 租赁负债 —— 期末余额（新租赁准则实施后单独列示）
    sign_convention: 绝对值列报
    missing_representation: null

  - id: bs.total_assets
    statement: 合并资产负债表
    line_item: 资产总计 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

formula: >
  (bs.short_term_borrowings
   + bs.trading_financial_liabilities
   + bs.non_current_liabilities_due_within_one_year
   + bs.long_term_borrowings
   + bs.bonds_payable
   + bs.lease_liabilities)
  / bs.total_assets

period_semantics: 时点

derivation:
  allow_from_components: true
  note: >
    有息负债在合并资产负债表上没有单一列报行项，分项加总是本指标的**唯一**构造方式，
    而非缺失时的补救路径。

    **允许加总的分项恰为以下六项，不多不少**：短期借款、交易性金融负债、
    一年内到期的非流动负债、长期借款、应付债券、租赁负债。

    **不得纳入**：应付账款、应付票据、预收款项、合同负债、应付职工薪酬、
    应交税费、其他应付款——这些是经营性负债，不承担利息。
    亦不得纳入递延所得税负债、预计负债。

    **任一分项缺失不得按 0 处理**：报表未列示某一项，可能是并入了其他项，
    与「该项确为零」在有息负债这个语境下含义完全不同。缺失即拒答。

standard_basis:
  - name: 关于修订印发一般企业财务报表格式的通知（财会〔2018〕15 号）
    issuer: 中华人民共和国财政部
    article: 附件一 合并资产负债表格式及编制说明
    version: "2018"
  - name: 企业会计准则第 21 号——租赁
    issuer: 中华人民共和国财政部
    article: 第四章（承租人的会计处理）
    version: "2018"
  - name: 企业会计准则第 30 号——财务报表列报
    issuer: 中华人民共和国财政部
    article: 第十七条至第二十一条
    version: "2014"

flags: []

undefined_conditions:
  - expr: is_missing(bs.total_assets)
    reason: 资产总计缺失
  - expr: bs.total_assets <= 0
    reason: 资产总计为零或为负，有息负债率无经济含义
  # 任一分项缺失即拒答。加总类指标最容易出的错就是把「报表没列这一项」当成「这一项是 0」。
  - expr: >
      is_missing(bs.short_term_borrowings)
      or is_missing(bs.trading_financial_liabilities)
      or is_missing(bs.non_current_liabilities_due_within_one_year)
      or is_missing(bs.long_term_borrowings)
      or is_missing(bs.bonds_payable)
      or is_missing(bs.lease_liabilities)
    reason: 六个有息负债分项中至少一项缺失；未列示不等于为零，不得补 0 后加总

common_pitfalls:
  - text: >
      **分项缺失不得按 0 处理。** 报表未列示某一项可能是并入了其他项，
      与「该项确为零」含义完全不同。补 0 会系统性低估有息负债率，
      且结果看起来完全正常。分项全部取值为 0 时正常计算，两条路径由
      missing_representation 区分。
    enforced_by: undefined_conditions.2

  - text: >
      **不得把应付账款、应付票据、合同负债等经营性负债计入有息负债。**
      允许加总的分项由 derivation.note 穷举，超出该范围即不是本指标。
    enforced_by: derivation.note

  - text: >
      有息负债的分项范围随报表格式版本变化。财会〔2018〕15 号修订前后，
      「交易性金融负债」与「以公允价值计量且其变动计入当期损益的金融负债」列报名称不同，
      跨该次修订的年度间可比性需确认。
    enforced_by: flags.basis_version_mismatch

  - text: >
      **租赁负债自新租赁准则（企业会计准则第 21 号，2018 年修订）实施后才单独列示。**
      此前年度的经营租赁不进表，有息负债率因此系统性偏低。
      跨该准则实施年度的比较必须说明这一点。
    enforced_by: source_fields.line_item

  - text: >
      资产总计为零或为负时拒答。
    enforced_by: undefined_conditions.1

  - text: >
      有息负债率反映付息压力，但不反映利率水平与期限结构。
      同样的有息负债率，短债占比高的公司再融资风险显著更大。
    advisory_only: true
