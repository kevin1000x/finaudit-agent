metric_id: return_on_total_assets
display_name: 总资产收益率
aliases:
  - 总资产报酬率
  - ROA
  - 资产收益率
version: 2

grain:
  entity: stock_code
  period: fiscal_year
  period_type: annual

source_fields:
  # 分子用**含少数股东损益的净利润**——这是与归母类指标相反的选择，理由见下方陷阱：
  # 分母是全部资产（含少数股东所享有的部分），分子必须与之配比。
  - id: is.net_profit
    statement: 合并利润表
    line_item: 净利润（含少数股东损益）
    sign_convention: 收益记正_损失记负
    missing_representation: null

  - id: bs.total_assets
    statement: 合并资产负债表
    line_item: 资产总计 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  - id: notes.restatement_flag
    statement: 财务报表附注
    line_item: 本期是否经追溯重述或会计政策变更调整
    missing_representation: null
    enum_values: [true, false]

formula: >
  is.net_profit / bs.total_assets

# 分子是时段量（全年净利润），分母是时点量（期末资产总计），故为混合。
period_semantics: 混合

derivation:
  allow_from_components: false
  note: >
    分母固定取**期末时点**资产总计。POC-01 的 C9 已指出字段粒度不统一：
    流动负债有期初期末双值，而总资产只有单值。
    禁止用其他年度的期末值自行构造期初期末平均数——那需要跨期取数，
    本定义的 grain 只锁定单个会计年度，跨期取数不在其可定位范围内。
    采用平均分母的口径是另一个指标，不是本指标的变体。

standard_basis:
  - name: 企业会计准则第 30 号——财务报表列报
    issuer: 中华人民共和国财政部
    article: 第十五条、第十六条
    version: "2014"
  - name: 企业会计准则第 33 号——合并财务报表
    issuer: 中华人民共和国财政部
    article: 第五章
    version: "2014"

flags:
  - name: restated
    trigger: notes.restatement_flag == true

undefined_conditions:
  - expr: is_missing(bs.total_assets)
    reason: 资产总计缺失
  - expr: bs.total_assets <= 0
    reason: 资产总计为零或为负，收益率无经济含义
  - expr: is_missing(is.net_profit)
    reason: 净利润缺失

common_pitfalls:
  - text: >
      分子用含少数股东损益的净利润，**不用归母净利润**——这与归母类指标的选择相反。
      理由是配比：分母是全部资产（含少数股东所享有的部分），
      分子若只取归母部分，会在少数股东权益占比高的公司系统性低估收益率。
    enforced_by: source_fields.id

  - text: >
      本定义采用**期末时点**分母，与采用期初期末平均分母的口径**不可直接比较**。
      资产规模当年大幅变动时两者差异显著。
    enforced_by: derivation.allow_from_components

  - text: >
      资产总计为零或为负时拒答。
    enforced_by: undefined_conditions.1

  - text: >
      净利润缺失时拒答，不得用营业利润或利润总额代替。
    enforced_by: undefined_conditions.2

  - text: >
      本期经追溯重述时，分子分母均建立在重述后数据上。
    enforced_by: flags.restated

  - text: >
      重资产与轻资产行业的总资产收益率不在同一量级，横向比较须限定行业。
    advisory_only: true
