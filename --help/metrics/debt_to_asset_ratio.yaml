metric_id: debt_to_asset_ratio
display_name: 资产负债率
aliases:
  - 负债率
  - 杠杆率
  - 资产负债比率
version: 2

grain:
  entity: stock_code
  period: fiscal_year
  period_type: annual

source_fields:
  - id: bs.total_liabilities
    statement: 合并资产负债表
    line_item: 负债合计 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  - id: bs.total_assets
    statement: 合并资产负债表
    line_item: 资产总计 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  - id: notes.restatement_flag
    statement: 财务报表附注
    line_item: 本期是否经追溯重述或会计政策变更调整
    missing_representation: null
    enum_values: [true, false]

formula: >
  bs.total_liabilities / bs.total_assets

period_semantics: 时点

derivation:
  allow_from_components: false
  note: >
    禁止由「流动负债合计 + 非流动负债合计」相加倒推负债合计。
    报表已单独列示负债合计，倒推会在合计口径与分项口径不一致时**静默产生差额**
    （例如某些递延项目的归类差异）。合计项缺失即拒答。

standard_basis:
  - name: 企业会计准则第 30 号——财务报表列报
    issuer: 中华人民共和国财政部
    article: 第十七条至第二十一条
    version: "2014"
  - name: 关于修订印发一般企业财务报表格式的通知（财会〔2018〕15 号）
    issuer: 中华人民共和国财政部
    article: 附件一 合并资产负债表格式
    version: "2018"

flags:
  - name: restated
    trigger: notes.restatement_flag == true

undefined_conditions:
  - expr: is_missing(bs.total_assets)
    reason: 资产总计缺失
  - expr: bs.total_assets <= 0
    reason: 资产总计为零或为负，资产负债率无经济含义
  - expr: is_missing(bs.total_liabilities)
    reason: 负债合计缺失；不得由流动与非流动负债相加倒推

common_pitfalls:
  - text: >
      **不得用母公司报表口径替代合并口径。** 母公司资产负债率与合并口径可差数十个百分点，
      尤其在子公司承担主要债务的集团。本定义的取数来源固定为合并资产负债表。
    enforced_by: source_fields.statement

  - text: >
      负债合计缺失时拒答，不得由流动负债与非流动负债相加倒推。
    enforced_by: derivation.allow_from_components

  - text: >
      资产总计为零或为负时拒答。
    enforced_by: undefined_conditions.1

  - text: >
      本期经追溯重述时，两项余额均建立在重述后数据上。
    enforced_by: flags.restated

  - text: >
      部分公司发行永续债并计入权益，与将其视为债务的调整口径相比资产负债率显著偏低。
      本定义按报表列报口径取数，不做该项调整；与做了调整的口径不可直接比较。
    advisory_only: true
