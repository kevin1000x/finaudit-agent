# **合成数据。不来自任何真实公司、任何年报、AKShare 或其他第三方源。**
#
# 公司代码与名称均为虚构，数值为构造陷阱而手写。**不得当作事实引用，不得用于任何实证结论。**
# 把合成数据说成真实数据，是比数据本身更严重的问题（D-010 / D-013）。
#
# 为什么用合成而不是真实年报：C3 考的是**聚合粒度、缺失期、零分母、同名不同实体**
# 这四类构造出来的陷阱（EVAL_CASES §3 陷阱设计栏原文）。真实年报里这些情形可遇不可求，
# 构造比寻找可控得多。且 NFR-05 要求无网络时可完成评测。
#
# 效力边界：基于本夹具的数值结论**只证明计算逻辑正确，不证明数据抽取正确**。
# 抽取正确性属于 Phase 2 的 PDF 抽取器，与本夹具无关。
#
# 字段 id 与报表名沿用语义层的受控词汇，使其在结构上真实。

meta:
  fixture_id: synthetic-01
  nature: 合成数据（虚构公司与数值）
  currency: CNY
  unit: 元
  note: 全部数值以「元」为单位列示，无单位混用陷阱——单位陷阱由 C3-005 单独构造

