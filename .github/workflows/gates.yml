# 本文件是 PROJECT_SPEC.md §11「完成必须有证据」的机器化载体。
# 决策依据 D-021（2026-08-22 修订：开发期 CI 不视为 NFR-02 的部署基础设施）。
# 改动本文件等同于改动门禁定义，须同步 rules/commands.md。

name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 只读权限：本工作流不写仓库、不发布任何东西。
permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 五道门 + 冻结校验。任一红即整个 job 红。
  # 新增门禁时**必须同步这里**：2026-08-23 加的第五道门就漏了整整一天，
  # 而步骤名、echo、实际命令三者不一致这件事没有任何检查会发现。
  # 按 F-8：验证与后续动作一律 && 串联，不用 ; 也不用分步骤吞掉退出码。
  # ---------------------------------------------------------------
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 是 pyproject.toml 声明的下限，跑它才能证明那条声明是真的。
        # 3.13 是当前主流版本，两端都跑才看得出版本漂移。
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # ⚠️ 2026-09-11：阅读台账那道门**随 `references/` 一起移出本仓**（`D-043`）——
      # 它的检查对象不在这里了，链上从六条减到五条。这是一次真的减法，
      # 放弃了什么、什么条件下拿回来，写在 `D-043`，不在这里重复。
      #
      # 🔴 **步骤名 / echo / 实际命令三者必须对齐。** 2026-08-24 之前它们不一致
      # （名字写「五道门」、echo 写「四道门」、实际跑四条），而没有任何检查会发现。
      # 本次减到五条时三处一并改了 —— `check_gates.py` 的 R4 只能查
      # 「已登记的门禁在不在 CI 里」，查不到这三者一致。
      - name: 五道门（&& 串联，任一红即停）
        run: |
          python -m pytest -q \
            && python -m semantic_layer scan \
            && python -m semantic_layer validate \
            && python scripts/check_xrefs.py \
            && python scripts/check_gates.py \
            && echo "五道门全 exit 0"

      # 冻结校验放在 Linux runner 上跑，顺带验证 D-012 的物理保障：
      # .gitattributes 强制 LF 入库，SHA-256 必须跨平台稳定。
      # 这一条在本地（Windows）跑不出来——CRLF 一旦混进去，只有这里会红。
      # ⚠️ **每冻结一套新题就往下面加一行。** 独立复核（2026-09-11）查出
      #    `frozen-02` 与 `frozen-03` 当时都不在这一步里 —— 它们的哈希只在
      #    有人手工跑评测时才被校一次，而这一条恰恰是**只有 Linux runner 才红**的那种。
      - name: 冻结校验（D-012，同时验证跨平台哈希稳定）
        run: |
          cd eval/frozen-01 && sha256sum -c SHA256SUMS \
            && cd ../frozen-02 && sha256sum -c SHA256SUMS \
            && cd ../frozen-03 && sha256sum -c SHA256SUMS \
            && cd ../../docs/agent/poc-01 && sha256sum -c SHA256SUMS

  # ---------------------------------------------------------------
  # 供应链与许可证门禁（D-014）。单独成 job：它要访问 PyPI，
  # 网络抖动不应该让上面那组门禁变红——失败归因要清楚。
  # ---------------------------------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔴 `setuptools` 必须一起升级，不能只升 pip。
      #
      # 2026-09-11 实测：`setup-python` 的 3.11 由 `ensurepip` 带进来一份**旧**
      # setuptools，它的 METADATA 里 `License` / `License-Expression` /
      # `License :: ` classifier **三者皆无** ⇒ `scan_installed_licenses()`
      # 判它「零许可证声明」并红。
      #
      # ⚠️ **门禁在这件事上是对的**：它的原则是「零声明 ≠ 不是 AGPL，
      # 查不到就是查不到，不据此放行」。所以正解**不是**把 setuptools 加进豁免
      # 名单 —— 那会让它对这个包不再检查任何东西，而输出照样是一句「通过」，
      # 正是本仓反复记的那个形状。
      #
      # 正解是**消掉陈旧元数据**：新版 setuptools 声明 `License-Expression: MIT`
      # （本地实测 84.0.0 有），升上去之后这道检查**真的检查了它并放行**。
      # 🔴 **必须装 `crosscheck` extra，否则这道门根本检不到 akshare。**
      #
      # 2026-09-11 实测出来的：CI 此前装的是 `.[dev]`，而 `verify_deps.py` 检查的是
      # **`pyproject.toml` 声明的全部依赖**（含各 extra）⇒ akshare 每次都落在
      # `== akshare: 未安装，无从核验`，而 `check_package` 对「未安装」`return False`
      # ⇒ 退出码 1。
      #
      # ⚠️ 要紧的不是它红，是**它红的原因不是它要查的那件事**。
      # `D-036` 接受这道门红着，说的是「akshare 下载量跌破门槛」这个**有信息量**的红；
      # 而 CI 上实际发生的是「没装所以没查」——两者在退出码上不可区分，
      # 20/20 次运行全红之后，没有人分得清是哪一种。
      # 这正是本脚本自己 docstring 里那句「长期红着的门等于没有门」。
      #
      # ⇒ 装上它，让这道门真的去查 akshare：够门槛就绿，跌破就红，
      #    而那时的红是 `D-036` 想要的那一种。
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools \
            && python -m pip install -e ".[dev,crosscheck]"

      - name: 许可证禁列（AGPL 拒绝，含传递依赖）
        run: python scripts/verify_deps.py
