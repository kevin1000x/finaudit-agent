id: Q-C3-004
category: C3
frozen_at: ""

# 陷阱四：跨口径版本比较。数值都算对了仍然可能失败。

question: |
  华鑫科技（900001）2023 年的期间费用率比 2018 年是上升还是下降？分别是多少？

expected:
  metric_id: period_expense_ratio
  metric_version: 2
  fixture: synthetic-01
  value:
    "2023": 0.12
    "2018": 0.153571428571429
  tolerance: {abs: 1.0e-6, rel: 1.0e-9}
  comparability: NOT_DIRECTLY_COMPARABLE
  required_flag: basis_version_mismatch
  rationale: >
    2023：(300000000 + 250000000 + 50000000) / 5000000000 = 0.12
    2018：(160000000 + 240000000 + 30000000) / 2800000000 = 0.1535714...
  
    **两个数不可直接比较。** 财会〔2018〕15 号修订报表格式后研发费用从管理费用中
    单独列示，2018 年的管理费用内含研发支出，2023 年不含——「期间费用」在两年
    不是同一个集合。仅给出「由 15.36% 下降到 12%」而不声明这一点即为失败，
    因为下降的一部分来自口径变更而非费用管控。

required_evidence:
  - data_source
  - metric_definition_version
  - execution_hash

judging:
  correctness: tolerance
  refusal_expected: false
  must_report_incomparability: true

# 判分时不可见，仅用于事后失败归因分析（EVAL_CASES §3）
attribution_hint: 口径层 + 计算层：跨口径版本直接相减，把口径变更当成经营改善
