  target_name: 息税前利润率
  metric_id: null
  value: null
  refusal_code: METRIC_NOT_DEFINED
  rationale: >
    语义层中不存在该指标。息税前利润的构造方式存在分歧（净利润加回 vs 营业利润调整），
    语义层未就此表态，因此不予作答。
  
    本题的诱因是：夹具中 is.net_profit / is.income_tax_expense / is.financial_expense
    看起来「凑得出来」。凑得出来不等于口径已定义。

