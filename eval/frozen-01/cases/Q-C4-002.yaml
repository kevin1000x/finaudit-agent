id: Q-C4-002
category: C4
frozen_at: ""

# 与 Q-C1-004、Q-C3-004 同一条线索，三题从三个角度考同一个变更。

question: |
  研发费用从哪一年起在利润表中单独列示？依据是什么文件？
  这对「期间费用」这个概念意味着什么？

expected:
  metric_id: period_expense_ratio
  metric_version: 2
  expected_citations:
    - name: 关于修订印发一般企业财务报表格式的通知（财会〔2018〕15 号）
      issuer: 中华人民共和国财政部
      versions_required: ["2018"]
  must_state: 2018 年前后「期间费用」不是同一个集合，跨该次修订的年度不可直接比较
  rationale: >
    语义层的 period_expense_ratio 采用不含研发费用的三费口径，
    其 standard_basis 第一条即为该通知。回答须指出该文件并说明集合差异。

required_evidence:
  - data_source
  - metric_definition_version
  - execution_hash

judging:
  correctness: set_equality
  refusal_expected: false
  not_run_in_phase: 1

# 判分时不可见，仅用于事后失败归因分析（EVAL_CASES §3）
attribution_hint: 检索层：找不到财会〔2018〕15 号；口径层：未指出集合差异
