# 加权平均 vs 全面摊薄，且本题的正确行为是拒答。通用 Agent 在这里最容易「算一个出来」。

question: |
  新元（900004）2023 年的净资产收益率是多少？

expected:
  metric_id: roe_weighted_average
  metric_version: 2
  value: null
  refusal_code: UNDEFINED_CONDITION_HIT
  rationale: >
    夹具中该公司未披露 kpi.roe_weighted_average_disclosed。
    加权平均净资产收益率涉及净资产增减变动的月份权数，年度报表不足以复算，
    语义层的立场是禁止倒推、未披露即拒答。
  
    用 20000000 / 700000000 = 0.0286 倒推得到的是**全面摊薄**口径，不是加权平均——
    那个数看起来完全正常，但回答的不是提问者问的口径。这是本题的全部意义。

required_evidence:
  - data_source
  - metric_definition_version
  - execution_hash

judging:
  correctness: exact
  refusal_expected: true

# 判分时不可见，仅用于事后失败归因分析（EVAL_CASES §3）
attribution_hint: 口径层：用期末净资产倒推出一个全面摊薄口径的数冒充加权平均
