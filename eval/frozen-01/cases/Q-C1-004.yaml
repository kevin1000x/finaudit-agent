id: Q-C1-004
category: C1
frozen_at: ""

# 2018 年格式变更带来的集合差异。这也是 Q-C3-004 与 Q-C4-002 的同一条线索。

question: |
  华鑫科技（900001）2023 年的期间费用率是多少？

expected:
  metric_id: period_expense_ratio
  metric_version: 2
  value: 0.12
  tolerance: {abs: 1.0e-6, rel: 1.0e-9}
  rationale: >
    (300000000 + 250000000 + 50000000) / 5000000000 = 0.12。
    语义层的口径**不含研发费用**：财会〔2018〕15 号修订报表格式后研发费用从管理费用
    单独列示，含与不含是两个不同的集合。回答须声明所采用的口径。

required_evidence:
  - data_source
  - metric_definition_version
  - execution_hash

judging:
  correctness: tolerance
  refusal_expected: false

# 判分时不可见，仅用于事后失败归因分析（EVAL_CASES §3）
attribution_hint: 口径层：期间费用是否含研发费用未声明或选择错误
