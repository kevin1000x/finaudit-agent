# 「净资产收益率」在实务上对应两个口径，语料只定义了其中一个。

question: |
  长庚重工（900105）2023 年的净资产收益率是多少？

expected:
  metric_id: roe_weighted_average
  metric_version: 2
  value: null
  refusal_code: METRIC_NOT_DEFINED
  fixture: synthetic-02
  rationale: >
    「净资产收益率」在实务中同时对应加权平均与全面摊薄两个口径。
    语义层只定义了加权平均一个（roe_weighted_average），全面摊薄没有定义。
    因此题面这个说法在语料里不存在唯一对应，正确行为是拒答并点明这个差别，
    不是替提问者选一个。
    
    🔴 本题与数据缺失无关：该夹具行的 kpi.roe_weighted_average_disclosed = 7.40
    是有值的。所以这次拒答只可能出于口径原因——这一点是刻意构造的。
    frozen-01 的同型题把「口径不唯一」与「该公司未披露」两个原因叠在了一起（见 N-67），
    读者无法分辨系统是因为哪一个而拒答。本题把另一个原因移除了。

required_evidence:
  - data_source
  - metric_definition_version
  - execution_hash

judging:
  correctness: exact
  refusal_expected: true

# 判分时不可见，仅用于事后失败归因分析（EVAL_CASES §3）
