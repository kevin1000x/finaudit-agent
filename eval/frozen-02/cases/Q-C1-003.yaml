# 「三费」在语料里是合计口径，不是三个单项。

question: |
  长庚重工（900105）2023 年的三费占比是多少？

expected:
  metric_id: period_expense_ratio
  metric_version: 2
  value: 0.11
  tolerance: {abs: 1.0e-6, rel: 1.0e-9}
  fixture: synthetic-02
  rationale: >
    （160000000 + 200000000 + 80000000）/ 4000000000 = 0.11。
    本夹具中 900101 与 900102 的期间费用率均为 0.10，与本题的 0.11 不同——
    数值刻意错开，答错公司不会碰巧得到正确答案。

