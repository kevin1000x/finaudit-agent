# **合成数据。不来自任何真实公司、任何年报、AKShare 或其他第三方源。**
#
# 公司代码与名称均为虚构，数值为构造陷阱而手写。**不得当作事实引用，不得用于任何实证结论。**
# 把合成数据说成真实数据，是比数据本身更严重的问题（D-010 / D-013）。
#
# 为什么再造一份而不复用 synthetic-01：
#   1. **`N-19` 的判据要求 C2 靶子的分量字段齐全。** synthetic-01 缺 6 个有息负债分量、
#      缺 `notes.nonrecurring_pl_net_attributable_to_parent`、缺 `notes.consolidation_scope_change`
#      —— 于是 4 个 C2 靶子里有 2–3 个「指标未定义」与「数据缺失」两个原因混在一起，
#      拒答证明不了口径纪律。本夹具把这些分量**全部补齐**，让拒答只可能有一个原因。
#   2. **`N-46` 第 2 条**：synthetic-01 有 6 处 `notes.business_combination_type: 无`，
#      是 `D-028` 取消哨兵值之前的写法。`D-012` 不许改冻结集，所以那 6 处只能留着；
#      本夹具按 `D-028` 的现行语义写：**集合值，空集表示本期无企业合并，不写「无」**。
#      900105 一行同时列出两类合并，正是 `D-028` 背景里万华 2019 的那种真实形态。
#   3. **复核者未污染。** frozen-01 的 15 道题与其证据页复核者已全部读过（`h2-01`）。
#      同人同题重测测的是记忆 —— 换公司、换数值、换陷阱形态是这次重测成立的前提。
#
# 效力边界：基于本夹具的数值结论**只证明计算逻辑正确，不证明数据抽取正确**。
# 抽取正确性属于 Phase 2 的 PDF 抽取器，与本夹具无关。

