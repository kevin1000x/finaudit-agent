  rationale: >
    承继 V-008。万华化学在覆盖面里（2019 年），2023 年不在 ⇒ 取不到数 ⇒ NOT_COVERED。「核不了」是正当输出不是失败（D-041 §3）。⚠️ 这一条的判定**先于**口径判据：拿不到数时谈口径没有意义，所以 D-045 不改变它。

