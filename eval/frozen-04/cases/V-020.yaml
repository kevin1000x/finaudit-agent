  rationale: >
    承继 V-006。「负债率」是 debt_to_asset_ratio 的别名，正式名是「资产负债率」⇒ 判据①（别名 ≠ 正式名）命中。D-045 之后判据②也命中：该定义自己写着「与做了调整的口径不可直接比较」（永续债）、「母公司资产负债率与合并口径可差数十个百分点」。**两条并联只会得到同一个判定**，这一题钉的就是这件事 —— 补一条判据不许改变已经对的那些。

