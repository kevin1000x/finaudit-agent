    承继 V-011。第二条自己没写主体与期间 ⇒ 两维都承接，而承接了就必须印出来（D-041 §2）。COMPUTED-VALUES §1.6 = 0.919649372413579757379092352（差 0.0000494 < 容差 0.00005）、§1.7 = 0.08523388089246972163777（差 0.0000339 < 0.00005）。**两条都压在容差边缘**：容差规则若被改成拍一个固定 1e-6，两条当场翻红。🔴 这一题也是 D-045 的反向控制：毛利率与期间费用率在 _basis_choice 里都是 false，所以它们**仍然判得出「一致」** —— 一个把 20 份定义全标成「口径未声明」的改法会在这里红。

