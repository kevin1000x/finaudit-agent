# 🔴 承继 V-003 并**改正它的标准答案**：速动比率的口径是一次选择。

conclusion: |
  600519 2023 年速动比率 3.67。

expected:
  read_as: STATEMENT
  claims:
    - text: 600519 2023 年速动比率 3.67
      verdict: AMBIGUOUS_BASIS
      stated_text: "3.67"
  rationale: >
    🔴 V-003 的标准答案写的是 CONSISTENT，理由逐字是「速动比率的正式名就是「速动比率」，口径没有歧义」—— 而 metrics/quick_ratio.yaml 自己写着「**不采用**另一套口径（再扣预付款项、一年内到期的非流动资产、其他流动资产）—— 两套算法的结果不可直接比较」、「跨来源引用速动比率前须确认对方口径」。两句话对不上，V-003 因此按 D-012 修订二作废（构造错误）。正确答案是 AMBIGUOUS_BASIS：COMPUTED-VALUES §1.3 = 3.670351116817004026158851655，与「3.67」在容差内对得上（这一点仍然印在 reason 里），**但对得上是以一次未声明的口径选择为前提的**，所以判定不是「一致」。

