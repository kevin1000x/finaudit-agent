# 🔴 frozen-03 **整批作废**（`D-012` 修订三，决策 `D-045`）
#
# 这不是「分数变低了」，是**三道题的标准答案与定义语料矛盾**，而作废率超了上限。
#
# ## 为什么是构造错误，不是「迁就模型」
#
# `D-012` 修订二把作废分成两类，分界线是**可判定性**：
# 「构造错误 = **不看系统输出就能认定**该题不成立：…标准答案与定义语料矛盾…」；
# 「迁就模型 = 需要先看到系统的回答才能论证这题『不好』⇒ **禁止作废**」。
#
# 这三题落在第一类，论证链里**不需要任何系统输出**：
#
# 1. `metrics/quick_ratio.yaml` 自己写着：「**不采用**另一套口径（再扣预付款项、
#    一年内到期的非流动资产、其他流动资产）—— 两套算法的结果不可直接比较」、
#    「跨来源引用速动比率前须确认对方口径」。
# 2. 而 `V-003` 的 `rationale` 逐字写着：「**速动比率的正式名就是「速动比率」，
#    口径没有歧义** ⇒ 可以判一致/不一致」。
# 3. `D-041` 定义 `AMBIGUOUS_BASIS` =「口径未声明 —— 本系统按某一个口径解释了它，
#    换一个口径是另一个数」。
#
# ⇒ ①②③ 放在一起，`V-003` 的标准答案与它所依赖的定义语料**直接矛盾**。
# `V-012` 的第二条是同一句声明，`V-004` 是 `free_cash_flow`（定义自己写着
# 「常见变体至少有四种，结果差异可达数倍」）的同型。
#
# ⚠️ **如实记一句发现路径**：这三题是沿着 `N-84` 发现的，而 `N-84` 的实测
# 用到了系统行为（把 20 份定义的正式名喂进 `_match_alias`）。
# **但作废的判据不依赖那条路径** —— 上面 ①②③ 三行全部出自仓库里的文本。
# `D-012` 问的是「能不能不看输出就认定」，不是「当初是怎么发现的」。
#
# ## 作废率：3/14 = 21.4% > 10% ⇒ 整批
#
# `D-012` 修订三：「单个冻结批次的构造错误作废率 > 10% ⇒ 该批次判为构造失败，
# **整批作废重建**，且必须公开记录作废率。理由：个别构造错误是可容忍的残余，
# 成批出现说明前置门禁没起作用或**题目设计本身不成熟**。」
#
# **后半句在这里是实话**：这 14 道题的期望，是照着一个判据方向反了的实现写的。
# 挑三题剔掉再报 11/11 正是那条修订点名的「粉饰」。
#
# ## 重建后的那一批没有变成「检验」
#
# `frozen-04` 的出题人仍然是写实现的人（`N-80` 原样成立）。重建修掉的是
# **标准答案与定义语料矛盾**，不是出题人独立性。⇒ 它仍然是**回归**，不是检验。

suite: frozen-03
