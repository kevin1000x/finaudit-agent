# 与 01-04 的归母净利率**立场相反**，差别必须写清楚，否则复核者会认为两处不一致：
#
#   净利率（分母营业收入）  分子为负 → 不拒答。负净利率的负号有明确含义：亏损。
#   净现比（分母归母净利润）分母 ≤ 0 → 拒答。 净现比的解读建立在「每一元净利润背后
#                                          有多少经营现金」上，分母为负时比值符号会误导：
#                                          经营现金流为正、净利润为负，比值为负，
#                                          但这其实是「盈利质量好」的情形。

metric_id: ocf_to_net_profit_attributable
display_name: 净现比
aliases:
  - 经营现金流与归母净利润之比
  - 盈利质量比率
  - 现金含量比率
version: 2

grain:
  entity: stock_code
  period: fiscal_year
  period_type: annual

source_fields:
  - id: cfs.net_cash_flow_from_operating_activities
    statement: 合并现金流量表
    line_item: 经营活动产生的现金流量净额 —— 本期金额
    sign_convention: 收益记正_损失记负
    missing_representation: null

  - id: is.net_profit_attributable_to_parent
    statement: 合并利润表
    line_item: 归属于母公司所有者（股东）的净利润
    sign_convention: 收益记正_损失记负
    missing_representation: null

  - id: notes.restatement_flag
    statement: 财务报表附注
    line_item: 本期是否经追溯重述或会计政策变更调整
    missing_representation: null
    enum_values: [true, false]

formula: >
  cfs.net_cash_flow_from_operating_activities
  / is.net_profit_attributable_to_parent

period_semantics: 时段

derivation:
  allow_from_components: false
  note: >
    分母固定取归母净利润，**不取** is.net_profit（含少数股东损益）。
    禁止由「净利润 − 少数股东损益」倒推归母净利润。
    禁止用扣非归母净利润替代分母——那是另一个口径的净现比，两者不可混比。
    禁止由现金流入流出小计倒推经营活动现金流量净额。

standard_basis:
  - name: 企业会计准则第 31 号——现金流量表
    issuer: 中华人民共和国财政部
    article: 第二章（经营活动现金流量的分类与列报）
    version: "2006"
  - name: 企业会计准则第 33 号——合并财务报表
    issuer: 中华人民共和国财政部
    article: 第五章
    version: "2014"

flags:
  - name: restated
    trigger: notes.restatement_flag == true

undefined_conditions:
  - expr: is_missing(is.net_profit_attributable_to_parent)
    reason: 归母净利润缺失
  - expr: is.net_profit_attributable_to_parent <= 0
    reason: >
      归母净利润为零或为负时，本比率的符号会误导：经营现金流为正而净利润为负会得到
      负比值，但那恰恰是盈利质量好的情形。此时应直接看现金流绝对额，不用本比率
  - expr: is_missing(cfs.net_cash_flow_from_operating_activities)
    reason: 经营活动现金流量净额缺失；不得按 0 处理

common_pitfalls:
  - text: >
      **本定义在「分母为负」时拒答，而归母净利率在「分子为负」时不拒答——两处立场不同，
      不是不一致。** 差别在于负号有没有含义：负净利率明确表示亏损；
      而净现比的分母为负时，比值的符号与盈利质量的方向相反，会把好情形显示成坏情形。
    enforced_by: undefined_conditions.1

  - text: >
      分母必须是归母净利润，不得用含少数股东损益的净利润。
      本定义的 source_fields 不声明 is.net_profit。
    enforced_by: source_fields.id

  - text: >
      **不得与用扣非归母净利润作分母的净现比混比。** 非经常性损益中的资产处置收益
      通常不产生经营现金流，两种口径在有大额非经常性损益的年度差异显著。
    enforced_by: derivation.note

  - text: >
      经营现金流量净额缺失时拒答，不得按 0 处理。
    enforced_by: undefined_conditions.2

  - text: >
      本期经追溯重述时，分子分母均建立在重述后数据上。
    enforced_by: flags.restated

  - text: >
      不同行业的合理阈值不同：重资产行业折旧摊销大，净现比天然高于 1；
      而快速扩张期的公司营运资金占用大，净现比可能长期低于 1 而并非盈利质量差。
    advisory_only: true
