# 口径是不是一次选择（`N-84` 的修法，`D-045`）
#
# ## 它回答的是哪一个问题
#
# 核查层判「口径未声明」（`AMBIGUOUS_BASIS`）原先只有一条判据：
# **命中的别名 ≠ `display_name`**。独立复核（2026-09-11）把 20 份定义的正式名
# 逐个喂进去核过 —— **20/20 都不触发**。也就是那条判据实际测的是
# 「用户打的字跟正式名不一样」，**不是**「这里发生过一次口径判断」。
#
# 它测出来的方向还是反的：`销售毛利率` 被标、更不具体的 `毛利率` 不标；
# 而 `自由现金流`（定义自己写着「常见变体至少有四种，结果差异可达数倍」）
# 与 `速动比率`（写着「另一套口径…两者结果不可直接比较」）**一律沉默**。
#
# ⇒ 本表让每份定义**自己说一句**：**这个指标的正式名本身，够不够确定口径。**
#
# ## 判据（写死，不许凭感觉填）
#
# `true` 当且仅当该定义**自己的散文**写明：同一个指标名下存在另一个常用口径，
# 且本定义与它的结果**不可直接比较**。`quote` 必须是那句话的**逐字片段**，
# 由 `tests/test_basis_choice.py` 机械核对它真的出现在那份定义的散文里
# （`derivation.note` / `common_pitfalls[].text` / `undefined_conditions[].reason`，
# 去掉空白后比对，免得被 YAML 折行骗过）。**编不出引用的，就不许标 `true`。**
#
# `false` 的三种情形，`why` 里逐条写明是哪一种：
#   ① 只有**取数纪律**（禁止倒推、禁止用某个字段替代另一个字段）——
#      那是「用错字段」，不是「另一个口径」；
#   ② 只有**跨年度**可比性（财会〔2018〕15 号那类格式修订）——
#      那是同一个口径在两个年度，不是两个口径；
#   ③ **正式名自己已经带了口径限定**（`加权平均净资产收益率` / `归母净利率`）——
#      用户写出这个名字时他已经声明了口径，再标一次是噪音。
#      ⚠️ 这一类的别名（`净利率` / `加权ROE`）**仍然**由原先那条
#      「别名 ≠ 正式名」的判据接住，没有放过它们。
#
# ## 为什么是一份旁挂文件，而不是写进定义文件里
#
# 复核者建议的是「在 `MetricDefinition` 上加一位」。**那条路有一个没人量过的代价**：
# 往定义 YAML 里加任何新键都会落进口径指纹（`D-034` 的剔除是白名单式的，
# 新键默认进指纹）⇒ 指纹变了就必须改 `version` ⇒ 而 `frozen-01` 的
# **14 道题的标准答案钉在 `metric_version: 2` 上**（实测 `grep -l metric_version`）。
# 也就是说：为了加一位**不改变任何计算结果**的元数据，要把 14/20 道已冻结的题作废，
# 70% ≫ `D-012` 修订三的 10% 上限 ⇒ 连 `frozen-01` 整批都要重建。
#
# ⇒ 这一位**不属于口径本身**（它不改变任何一个数），所以它不进语义载荷。
# 形态照 `_flags.yaml` 的先例：下划线开头 ⇒ 不是定义文件（`is_definition_file`），
# 随定义目录一起加载（`Registry.load`，路径跟着 `metrics_dir` 走而不是跟着 cwd 走）。
#
# ## 它不保证什么
#
# **这 20 条是人读完 20 份散文之后的判断，机器只核得住「引用真的在那份定义里」。**
# 「该标而没标」机器核不出来 —— 那需要一张「哪些指标在实务中有几种口径」的外部事实表，
# 本仓没有，也不打算编一张（编词表正是 `intent.py` 抬头点名的错方向）。
# ⇒ 下面每一条 `false` 都是一次**可被推翻的判断**，推翻它的方式是引用那份定义的散文。

version: 1

# `true` 9 条 / `false` 11 条。**这个数字有测试锁着**（改了必须同时改测试，
# 免得某天有人悄悄多标一个或少标一个）。
definitions:

  accounts_payable_turnover_days:
    basis_is_a_choice: true
    quote: 采用 360 基数的口径与本定义结果相差约 1.4%，不可直接比较
    why: 天数基数 365 vs 360 是一次选择；另有「应付账款 + 应付票据」合并口径。

  accounts_receivable_turnover_days:
    basis_is_a_choice: true
    quote: 账面余额口径会得到偏长的周转天数，两者不可混比
    why: 账面价值 vs 账面余额、365 vs 360、期末 vs 期初期末平均，三处都是选择。

  current_ratio:
    basis_is_a_choice: false
    why: ① 只有取数纪律（期末 vs 期初是时点取错，负债合计替代是用错字段）。流动比率的教科书口径单一。

  debt_to_asset_ratio:
    basis_is_a_choice: true
    quote: 与做了调整的口径不可直接比较
    why: 永续债是否视为债务、母公司 vs 合并，定义自己说后者「可差数十个百分点」。

  free_cash_flow:
    basis_is_a_choice: true
    quote: 常见变体至少有四种，结果差异可达数倍
    why: 定义自己写着本指标无准则定义、相减这个组合是本语义层的选择。

  gross_profit_margin:
    basis_is_a_choice: false
    why: ② 散文里的不可比全部是跨年度的（财会〔2018〕15 号运输费重分类）；「毛利额口径不一致」说的是禁止倒推，属 ①。⚠️ 这是一条边界判断：若将来有定义层证据表明「毛利率」本身有两种常用口径，推翻它。

  interest_bearing_debt_ratio:
    basis_is_a_choice: false
    why: ① 定义自己宣称「分项加总是本指标的唯一构造方式」，并穷举六项；不可比陈述全部是跨报表格式版本的，属 ②。

  inventory_turnover_days:
    basis_is_a_choice: true
    quote: 两者在存货规模当年大幅变动时差异显著，跨来源比较前须确认口径
    why: 期末 vs 期初期末平均（定义自己说常见数据库多用平均）、365 vs 360。

  minority_interest_share:
    basis_is_a_choice: false
    why: ① 定义说用归母权益作分母「得到的是另一个比率」—— 那是另一个指标，不是本指标的另一个口径。

  net_profit_attributable_excl_nonrecurring:
    basis_is_a_choice: false
    why: ② 不可比陈述是「项目清单随证监会解释性公告版本变化，跨版本年度不得直接比较」。

  net_profit_margin_attributable:
    basis_is_a_choice: false
    why: ③ 正式名「归母净利率」自己带了口径限定。别名「净利率」「销售净利率」不带，由「别名 ≠ 正式名」那条判据接住 —— 那正是 `V-010` 考的东西。

  net_working_capital:
    basis_is_a_choice: false
    why: ① 只有取数纪律与单位携带。与流动比率「不得互相换算后比较」说的是两个不同指标。

  ocf_to_net_profit_attributable:
    basis_is_a_choice: true
    quote: 两种口径在有大额非经常性损益的年度差异显著
    why: 分母取归母净利润还是扣非归母净利润，定义自己称后者是「另一个口径的净现比」。

  operating_cash_flow_ratio:
    basis_is_a_choice: false
    why: ① 别名收录范围（不收「现金流量比率」）是防止命中错指标；半年报累计数那条是期间长度，不是口径。

  period_expense_ratio:
    basis_is_a_choice: false
    why: ② 研发费用排除的理由在定义里写的是「纳入会使跨该次修订的年度不可比」，是跨年度。⚠️ 边界判断：实务中确有「四费率」的说法，若定义层补上「三费 vs 四费两种口径不可比」的散文，推翻它。

  quick_ratio:
    basis_is_a_choice: true
    quote: 跨来源引用速动比率前须确认对方口径
    why: 只扣存货 vs 再扣预付款项等，定义自己说「两者结果不可直接比较」。

  return_on_total_assets:
    basis_is_a_choice: true
    quote: 与采用期初期末平均分母的口径**不可直接比较**
    why: 期末时点 vs 期初期末平均分母。`ROA` 这个别名在实务里两种都指。

  revenue_growth_yoy:
    basis_is_a_choice: false
    why: ① 比较基数只能取本期报表列示的上期金额，取原始披露值是用错字段；重述那条属 ②。

  roe_weighted_average:
    basis_is_a_choice: false
    why: ③ 正式名与全部别名都带「加权平均 / 加权」。全面摊薄 ROE 确实是另一个口径，但用户写出这个名字时已经把口径声明了。

  total_asset_turnover:
    basis_is_a_choice: true
    quote: 与采用平均总资产口径的结论不可直接比较
    why: 期末时点 vs 平均总资产分母。
