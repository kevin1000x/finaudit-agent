# **自由现金流没有会计准则定义。** 它是分析惯例，不是列报项目。
#
# 诚实的做法是把这一点写进定义本身而不是回避。本文件的 standard_basis 只能支撑
# **两个分项**各自的列报依据，支撑不了「两者相减即自由现金流」这个组合——
# 那个组合是本语义层的选择，须自行承担。
#
# 这正是项目立论的展示物：anthropics/financial-services（34.3k★）写的是
# `FCF = Operating CF - CapEx`，**恰恰没说这句**（RESEARCH.md §2.1 已记录）。
# 它的口径被外包给了 FactSet / S&P；A 股没有这一层，所以口径必须自己承担，
# 而承担的方式是把「这里没有权威依据」明说出来，不是找一条准则硬凑上去。

metric_id: free_cash_flow
display_name: 自由现金流
aliases:
  - 企业自由现金流
  - FCF
  - 自由现金流量
version: 2

grain:
  entity: stock_code
  period: fiscal_year
  period_type: annual

source_fields:
  - id: cfs.net_cash_flow_from_operating_activities
    statement: 合并现金流量表
    line_item: 经营活动产生的现金流量净额 —— 本期金额
    sign_convention: 收益记正_损失记负
    missing_representation: null

  # 支付项在现金流量表上按**正数**列报，公式里做减法。
  # 符号约定错了结果直接翻倍 —— POC-01 C4 的同型风险。
  - id: cfs.cash_paid_for_fixed_intangible_and_other_long_term_assets
    statement: 合并现金流量表
    line_item: 购建固定资产、无形资产和其他长期资产支付的现金 —— 本期金额
    sign_convention: 绝对值列报
    missing_representation: null

formula: >
  cfs.net_cash_flow_from_operating_activities
  - cfs.cash_paid_for_fixed_intangible_and_other_long_term_assets

period_semantics: 时段

derivation:
  allow_from_components: false
  note: >
    **本指标无会计准则定义。** 下方 standard_basis 支撑的是两个分项各自的列报依据，
    **不支撑**「两者相减即自由现金流」这一组合——该组合方式是本语义层的选择。

    其他常见变体与本定义结果**不可比**：扣除营运资金变动的口径、
    扣除股权激励费用的口径、扣除全部投资活动现金流出的口径（后者会把理财与股权投资
    也算作资本开支）。引用任何外部来源的自由现金流数值前，必须先确认其组合方式。

    禁止用投资活动现金流量净额替代减项：那含处置资产收回的现金与理财往来，
    不是资本开支。禁止由现金流入流出小计倒推经营活动现金流量净额。

standard_basis:
  - name: 企业会计准则第 31 号——现金流量表
    issuer: 中华人民共和国财政部
    article: 第二章、第三章（经营活动与投资活动现金流量的分类与列报）
    version: "2006"

flags: []

undefined_conditions:
  - expr: is_missing(cfs.net_cash_flow_from_operating_activities)
    reason: 经营活动现金流量净额缺失；不得按 0 处理
  - expr: is_missing(cfs.cash_paid_for_fixed_intangible_and_other_long_term_assets)
    reason: 购建长期资产支付的现金缺失；不得按 0 处理（按 0 会使自由现金流等于经营现金流）
  # 刻意**不**列「结果为负」——扩张期企业自由现金流为负是常态，是真实信号。

common_pitfalls:
  - text: >
      **本指标无准则定义，跨来源不可比。** standard_basis 只支撑两个分项的列报依据，
      不支撑相减这个组合。引用外部来源的自由现金流前必须确认其组合方式，
      常见变体至少有四种，结果差异可达数倍。
    enforced_by: derivation.note

  - text: >
      **不得用投资活动现金流量净额替代减项。** 后者含处置资产收回的现金与理财往来，
      不是资本开支。本定义的 source_fields 只声明「购建固定资产、无形资产和其他
      长期资产支付的现金」这一项。
    enforced_by: source_fields.id

  - text: >
      支付项在现金流量表上按正数列报，公式里作减法。若数据源已按负数提供，
      结果会变成两项相加，直接翻倍，且不触发任何未定义条件——静默错误。
    enforced_by: source_fields.sign_convention

  - text: >
      任一分项缺失时拒答。特别是减项缺失按 0 处理会使自由现金流等于经营现金流，
      一个看起来完全正常的错误数字。
    enforced_by: undefined_conditions.1

  - text: >
      **结果为负不拒答。** 扩张期企业资本开支大于经营现金流是常态，
      负自由现金流是真实的经营信号而非异常，其解读须结合投产周期与在建工程规模，
      不宜单独作为经营质量结论。
    advisory_only: true
