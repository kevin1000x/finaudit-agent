metric_id: revenue_growth_yoy
display_name: 营业收入同比增长率
aliases:
  - 营收增长率
  - 营收同比增长
  - 营业收入增长率
  - 收入同比
version: 2

grain:
  entity: stock_code
  period: fiscal_year
  period_type: annual

source_fields:
  - id: is.operating_revenue_current
    statement: 合并利润表
    line_item: 营业收入 —— 本期金额
    sign_convention: 收益记正_损失记负
    missing_representation: null

  # 上期数**取本期报表列示的比较期金额**（即重述后数），不取上年年报当时原始披露的数。
  # 这是 POC-01 两位回答者都独立避开的陷阱，v1 定义把它写成散文，本版给它承载体。
  - id: is.operating_revenue_prior_as_presented
    statement: 合并利润表
    line_item: 营业收入 —— 上期比较金额（本期报表列示，即重述后数）
    sign_convention: 收益记正_损失记负
    missing_representation: null

  # 触发条件引用的字段必须在此声明，否则 R4 判不合规 —— POC-01 的 C5 缺的正是这一环。
  - id: notes.restatement_flag
    statement: 财务报表附注
    line_item: 比较期是否经追溯重述或会计政策变更调整
    missing_representation: null
    enum_values: [true, false]

formula: >
  (is.operating_revenue_current - is.operating_revenue_prior_as_presented)
  / is.operating_revenue_prior_as_presented

period_semantics: 时段

derivation:
  allow_from_components: false
  note: >
    禁止取 is.operating_revenue_prior_as_originally_reported（上年年报当时原始披露的营业收入）
    作为比较基数。存在追溯重述或会计政策变更时，两者不一致，用原始披露值会把重述影响
    错算成经营增长。比较基数只能是本期报表列示的上期比较金额。
    亦禁止由营业总收入减去其他业务相关项目倒推营业收入。

standard_basis:
  - name: 企业会计准则第 14 号——收入
    issuer: 中华人民共和国财政部
    article: 全文
    version: "2017"
  - name: 企业会计准则第 30 号——财务报表列报
    issuer: 中华人民共和国财政部
    article: 第十五条、第十六条
    version: "2014"
  - name: 企业会计准则第 28 号——会计政策、会计估计变更和差错更正
    issuer: 中华人民共和国财政部
    article: 第十一条至第十六条
    version: "2006"

flags:
  - name: restated
    trigger: notes.restatement_flag == true

undefined_conditions:
  - expr: is_missing(is.operating_revenue_prior_as_presented)
    reason: 本期报表未列示上期比较金额（首次披露、当年新上市或报表期间变更），无比较基数
  - expr: is.operating_revenue_prior_as_presented <= 0
    reason: 比较基数为零或为负，同比增长率无经济含义；不得对分母取绝对值
  - expr: is_missing(is.operating_revenue_current)
    reason: 本期营业收入缺失

common_pitfalls:
  - text: >
      上期数必须取本期报表列示的比较期金额（重述后），不得取上年年报当时原始披露的数。
      本定义的 source_fields 只声明前者，后者不是可取字段。
    enforced_by: source_fields.id

  - text: >
      比较期经追溯重述时，同比增长率含重述影响，与未重述年度的同比数不在同一基础上。
    enforced_by: flags.restated

  - text: >
      「营业收入」与「营业总收入」不是同一项目。金融类企业及含利息收入的公司两者差异显著。
      本口径固定取营业收入；报表仅列示营业总收入而无营业收入时，本定义所需字段即缺失。
    enforced_by: source_fields.id

  - text: >
      比较期缺失时拒答，不得按 0 处理，也不得用年化或推算值补齐。
    enforced_by: undefined_conditions.0

  - text: >
      分母为零或为负时拒答，不得对分母取绝对值后计算。
    enforced_by: undefined_conditions.1

  - text: >
      同一控制下企业合并会追溯调整比较期，数值可比但含合并范围变动，
      此时的同比增长不应被解读为内生增长。本定义不自动识别合并范围变动。
    advisory_only: true
