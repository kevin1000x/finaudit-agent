metric_id: net_profit_margin_attributable
display_name: 归母净利率
aliases:
  - 净利率
  - 销售净利率
  - 归母销售净利率
version: 2

grain:
  entity: stock_code
  period: fiscal_year
  period_type: annual

source_fields:
  # 分子取归母净利润，不取利润表底部的「净利润」（后者含少数股东损益）。
  # 与扣非归母净利润是同一类陷阱，处理方式沿用：另一个字段不进 source_fields。
  - id: is.net_profit_attributable_to_parent
    statement: 合并利润表
    line_item: 归属于母公司所有者（股东）的净利润
    sign_convention: 收益记正_损失记负
    missing_representation: null

  - id: is.operating_revenue_current
    statement: 合并利润表
    line_item: 营业收入 —— 本期金额
    sign_convention: 收益记正_损失记负
    missing_representation: null

  - id: notes.restatement_flag
    statement: 财务报表附注
    line_item: 本期是否经追溯重述或会计政策变更调整
    missing_representation: null
    enum_values: [true, false]

formula: >
  is.net_profit_attributable_to_parent / is.operating_revenue_current

period_semantics: 时段

derivation:
  allow_from_components: false
  note: >
    禁止用「净利润 − 少数股东损益」倒推归母净利润：两者在存在其他综合收益归属划分、
    或少数股东损益本身缺失时不等价。归母净利润未直接列示时按 undefined_conditions 拒答。
    亦禁止用营业总收入替代分母。

standard_basis:
  - name: 企业会计准则第 33 号——合并财务报表
    issuer: 中华人民共和国财政部
    article: 第五章
    version: "2014"
  - name: 企业会计准则第 14 号——收入
    issuer: 中华人民共和国财政部
    article: 全文
    version: "2017"
  - name: 企业会计准则第 30 号——财务报表列报
    issuer: 中华人民共和国财政部
    article: 第十五条、第十六条
    version: "2014"

flags:
  - name: restated
    trigger: notes.restatement_flag == true

undefined_conditions:
  - expr: is_missing(is.operating_revenue_current)
    reason: 营业收入缺失
  - expr: is.operating_revenue_current <= 0
    reason: 营业收入为零或为负，净利率无经济含义
  - expr: is_missing(is.net_profit_attributable_to_parent)
    reason: 报表未区分「归属于母公司所有者的净利润」与少数股东损益

common_pitfalls:
  - text: >
      分子必须是「归属于母公司所有者的净利润」，不是利润表底部的「净利润」——
      后者含少数股东损益。本定义的取数出处不声明利润表底部的「净利润」。
    enforced_by: source_fields.id

  - text: >
      **亏损年度分子为负是正常取值，不是未定义。** 负净利率有明确经济含义，
      本定义的 undefined_conditions 刻意不含「分子为负」这一条。
      把它列为未定义会让系统在最需要给出结论的年度拒答。
    enforced_by: source_fields.sign_convention

  - text: >
      分母为零或为负时拒答。
    enforced_by: undefined_conditions.1

  - text: >
      归母净利润缺失时拒答，不得用净利润代替。
    enforced_by: undefined_conditions.2

  - text: >
      本期经追溯重述时，净利率建立在重述后数据上，与未重述年度不在同一基础。
    enforced_by: flags.restated

  - text: >
      少数股东权益占比高的公司，归母净利率与整体净利率差异显著，
      两个口径回答的是不同问题，不宜互相替代解读。
    advisory_only: true
