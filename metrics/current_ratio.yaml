metric_id: current_ratio
display_name: 流动比率
aliases:
  - 流动资产负债比
  - current ratio
version: 2

grain:
  entity: stock_code
  period: fiscal_year
  period_type: annual

source_fields:
  - id: bs.total_current_assets
    statement: 合并资产负债表
    line_item: 流动资产合计 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  # 分母固定取**期末**余额。field_inventory 同时提供期初与期末双值，
  # POC-01 的 S5 单方缺陷就是没显式禁用期初值。
  - id: bs.total_current_liabilities_period_end
    statement: 合并资产负债表
    line_item: 流动负债合计 —— 期末余额
    sign_convention: 绝对值列报
    missing_representation: null

  - id: notes.restatement_flag
    statement: 财务报表附注
    line_item: 本期是否经追溯重述或会计政策变更调整
    missing_representation: null
    enum_values: [true, false]

formula: >
  bs.total_current_assets / bs.total_current_liabilities_period_end

period_semantics: 时点

derivation:
  allow_from_components: false
  note: >
    分母固定取流动负债合计的**期末余额**，禁止取 bs.total_current_liabilities_period_begin
    （期初余额）。两者在报表上并列，混用会让比率对应到错误的时点。
    亦禁止用 bs.total_liabilities（负债合计）替代分母——负债合计含非流动负债，
    与流动资产不配比，这是 POC-01 两位回答者都主动排除的陷阱。
    禁止由流动资产各明细项相加倒推流动资产合计。

standard_basis:
  - name: 企业会计准则第 30 号——财务报表列报
    issuer: 中华人民共和国财政部
    article: 第十七条至第二十一条（流动资产与流动负债的划分）
    version: "2014"
  - name: 关于修订印发一般企业财务报表格式的通知（财会〔2018〕15 号）
    issuer: 中华人民共和国财政部
    article: 附件一 合并资产负债表格式
    version: "2018"

flags:
  - name: restated
    trigger: notes.restatement_flag == true
  # 不声明 parent_only_scope：报表数据本身不携带「这是母公司报表还是合并报表」的字段，
  # 写不出能求值的 trigger。取数来源的口径由取数层保证，不由本定义假装能判定。

undefined_conditions:
  - expr: is_missing(bs.total_current_liabilities_period_end)
    reason: 报表未单独列示流动负债合计期末余额
  - expr: bs.total_current_liabilities_period_end <= 0
    reason: 流动负债合计为零或为负，流动比率无经济含义
  - expr: is_missing(bs.total_current_assets)
    reason: 流动资产合计缺失

common_pitfalls:
  - text: >
      分母固定取**期末**余额。报表同时列示期初与期末，取错时点会得到一个
      看起来正常但对应错误报告期的比率。本定义的 source_fields 不声明期初字段。
    enforced_by: source_fields.id

  - text: >
      不得用「负债合计」替代「流动负债合计」。前者含非流动负债，与流动资产不配比。
    enforced_by: derivation.note

  - text: >
      分母为零或为负时拒答。
    enforced_by: undefined_conditions.1

  - text: >
      流动资产合计缺失时拒答，不得由明细项相加倒推。
    enforced_by: derivation.allow_from_components

  - text: >
      本期经追溯重述时，两个余额均建立在重述后数据上。
    enforced_by: flags.restated

  - text: >
      本比率不反映流动资产的变现能力差异：存货占比高的公司流动比率虽高，
      短期偿债能力未必强。判断偿债能力应与速动比率并看。
    advisory_only: true
