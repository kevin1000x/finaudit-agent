# 年报「主要会计数据和财务指标」章节的**已披露值**（D-016）。
#
# kpi 与前四个命名空间的区别写在 semantic_layer/dsl.py 的 ROOT_NAMESPACES 注释里：
# 它承载**披露值**而非报表行项目，这使「取披露值、禁止倒推」这条口径立场可被表达
# —— 加权平均净资产收益率涉及月份权数，年度报表不足以复算。
#
# statement 承载的是**章节正文**（不含序号），茅台 2023 上排「七、」。
#
# ⚠️ **这张表走不通 bind_columns，而那不是它的缺陷**（PROBE-14.md §3）：
#   - 表头首格不是 `项目` 而是 `主要财务指标`（_HEADER_MARKER 判定失败）；
#   - 本子表没有单位/币种行 —— p5 y=187.0 的「单位：元 币种：人民币」属于
#     它上面的「(一) 主要会计数据」。而 ROE 是百分数，单位「元」对它本来就是错的；
#     强行继承会让 unit 变成一个静默取错的值，正是 L-34 要防的动作。
#   - 标签行与数值行**不同 y**：标签 y=659.2，数值 y=666.0，尾片段「百分点」在 y=672.9。
#
# ⇒ kpi 的取值路径由 01.5-05 单独实现，不复用报表表头绑定。
# 本文件先把口径写死，实现挂在 pipeline 的 kind 分派上。
#
# 🔴 **易混行**：紧接下一行是「扣除非经常性损益后的加权平均净资产收益率（%）」= 34.20，
# 与本字段的 34.19 只差 0.01，**取错了不会有任何恒等式报警**。
# 标签逐字不同，逐字相等匹配足以分开 —— 前提是不退成子串包含。

namespace: kpi
mapping_version: 1

entries:
  - field_id: kpi.roe_weighted_average_disclosed
    statement: 近三年主要会计数据和财务指标
    column_header: 本期金额
    kind: KPI_DISCLOSED
    label_variants:
      - label_fragments: ["加权平均净资产收益率（%）"]
