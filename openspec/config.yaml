schema: spec-driven

context: |
  项目：finaudit-agent —— 可审计的财务分析 Agent。
  一句话：回答财务问题时必须同时产出可独立复核的证据链（数据来源、指标口径版本、准则依据、执行内容、结果哈希）。

  技术栈：Python 3.11+ / pytest / YAML 语义层 / TUI（Phase 2 起）
  上游数据：巨潮资讯网年报、AKShare 公开财务指标（仅公开数据）
  已有资产：kevin1000x/cninfo-financial-analyzer（年报下载、PDF 解析、金融情感词典、Fog、TNI）

  权威文档优先级：PROJECT_SPEC.md > DECISIONS.md > EVAL_CASES.md > .planning/ > openspec/
  提任何变更前先读 DECISIONS.md，尤其 D-001（不做通用 Data Agent）、D-002（语义层先于 Agent）、
  D-003（证据链是第一类产物）、D-007（图谱须由问题驱动）、D-010（仅公开数据，不可协商）。

  当前阶段：Phase 0（cninfo 实证结论），无代码产出。H1（口径可判定性）尚未验证。

rules:
  proposal:
    - 必须写明与 DECISIONS.md 中相关决策的关系；若与任一 Accepted 决策冲突，先提决策变更再提功能变更
    - 必须包含 "Non-goals" 一节
    - 必须说明该变更属于 L0–L4 的哪一层
  tasks:
    - 每个 task 拆到 2 小时以内（周末 8 小时预算，D-008）
    - 涉及行为的 task 必须先写失败测试
    - 每个 task 完成后仓库必须处于可运行状态

operations:
  apply:
    guidance:
      - 计划与现实不符时立刻停止，按 EXPECTED / FOUND / IMPACT / OPTIONS 报告，不要即兴发挥
      - 不做与当前 task 无关的重构
  archive:
    guidance:
      - 归档前确认 docs/agent/PROGRESS.md 已记录真实输出而非计划
      - 归档前运行非公开数据扫描（D-010）

