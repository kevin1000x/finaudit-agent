# H2 复核答卷。每题填 verdict，取值域见下；note 可写一句为什么（选填）。
# 留空 = 没填。**「没填」和「填了无法判断」是两件事**，
# 混同会让 EVAL_CASES §4.3 那道反向检验失真 —— 所以留空时拒绝算数。
#
# ── 2026-09-06 由操作者填写 ────────────────────────────────────────────
# 复核者自述的判定口径（逐字保留，因为它决定这份读数怎么读）：
#   「只根据每一页是否足以『独立判断这次结果对不对』，不把项目中可能泄露的
#     标准答案或历史评测结果拿来反推。『无法判断』代表页面信息不足，而不是犹豫项。」
取值域: [对, 错, 无法判断]
verdicts:
  - id: H2-01
    verdict: 无法判断
    note: "系统称该指标没定义/没识别出来，但页面没给当时语义层的指标·别名清单或可验证快照 ⇒ 无法独立证明 METRIC_NOT_DEFINED 是对的"
  - id: H2-02
    verdict: 无法判断
    note: "给了定义、公式和最终数字 0.12，但没给实际参与计算的原始字段值（销售费用·管理费用·财务费用·营业收入各是多少）⇒ 无法独立验证这个数由这些输入算出。执行哈希能标识一次执行，不能代替计算输入"
  - id: H2-03
    verdict: 错
    note: "题面明确要求比较 2018 与 2023，出现两个期间正是提问意图，不构成「意图不完整」。以「有多个期间」为由拒答，等于没回答原问题"
  - id: H2-04
    verdict: 无法判断
    note: "同 H2-01：没有指标·别名清单快照，证不了 METRIC_NOT_DEFINED"
