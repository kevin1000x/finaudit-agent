[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finaudit-semantic-layer"
version = "0.1.0"
description = "可审计财务分析 Agent 的 L1 语义层：口径定义的结构契约与机械校验器"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.3", "pdfplumber>=0.11.5"]

[project.optional-dependencies]
dev = ["pytest>=8.4.2"]
# 对照源。**不进主 dependencies** —— AKShare 只作对照不作权威源（D-013），
# 不该是运行本项目的必要条件：抽取与计算全程只读年报 PDF，
# 缺了这个 extra 时跨源校验降级为「未做」，而不是整个项目跑不起来。
crosscheck = ["akshare>=1.18.94"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
